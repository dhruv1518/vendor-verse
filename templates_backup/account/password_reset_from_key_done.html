{% extends "base.html" %}

{% block title %}Password Changed - VendorVerse{% endblock %}

{% block content %}
<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10 text-center">
            <svg class="mx-auto h-12 w-12 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            <h2 class="mt-6 text-2xl font-bold leading-9 tracking-tight text-gray-900">Password Changed!</h2>
            <p class="mt-4 text-sm text-gray-600">
                Your password has been successfully changed.
            </p>
            <div class="mt-8">
                <a href="{% url 'account_login' %}" class="inline-flex items-center justify-center rounded-md border border-transparent bg-primary-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2">
                    Sign in with your new password
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
