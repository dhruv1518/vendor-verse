{% with pid=product.public_id|stringformat:"s" %}
{% with compare_list=request.session.compare_list|default:"" %}
<button hx-post="{% url 'products:compare_toggle' public_id=product.public_id %}"
        hx-swap="outerHTML"
        class="rounded-full p-2 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2
               {% if compare_list|length >= 4 and pid not in compare_list %}opacity-50 cursor-not-allowed{% endif %}
               {% if pid in compare_list %}text-blue-600 bg-blue-50{% else %}text-gray-400 hover:text-blue-500 hover:bg-blue-50{% endif %}"
        title="{% if pid in compare_list %}Remove from Compare{% elif compare_list|length >= 4 %}Compare list is full (Max 4){% else %}Add to Compare{% endif %}"
        {% if compare_list|length >= 4 and pid not in compare_list %}disabled{% endif %}>
    <svg class="h-6 w-6 {% if pid in compare_list %}text-blue-600{% endif %}" fill="{% if pid in compare_list %}currentColor{% else %}none{% endif %}" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5L7.5 3m0 0L12 7.5M7.5 3v13.5m13.5 0L16.5 21m0 0L12 16.5m4.5 4.5V7.5" />
    </svg>
</button>
{% endwith %}
{% endwith %}
