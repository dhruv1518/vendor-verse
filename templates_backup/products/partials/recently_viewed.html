{% if recently_viewed_products %}
<section class="mt-16">
    <div class="mb-6 flex items-center justify-between">
        <h2 class="text-xl font-bold text-gray-900 tracking-tight">Recently Viewed</h2>
    </div>
    <div class="relative">
        <div class="flex overflow-x-auto gap-6 pb-4 snap-x hide-scrollbar">
            {% for product in recently_viewed_products %}
            <div class="min-w-[240px] max-w-[240px] flex-none snap-start">
                <a href="{% url 'products:product_detail' vendor_slug=product.vendor.storefront.slug product_slug=product.slug %}" class="group block">
                    <div class="aspect-[4/3] overflow-hidden rounded-2xl bg-gray-100 ring-1 ring-gray-200 shadow-sm transition-all group-hover:shadow-md group-hover:ring-gray-300">
                        {% if product.primary_image %}
                        <img src="{{ product.primary_image.image.url }}" alt="{{ product.name }}" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105">
                        {% else %}
                        <div class="flex h-full items-center justify-center">
                            <svg class="h-10 w-10 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                        </div>
                        {% endif %}
                    </div>
                    <div class="mt-3">
                        <p class="text-sm font-semibold text-gray-900 line-clamp-1 group-hover:text-primary-600">{{ product.name }}</p>
                        <p class="text-xs text-gray-500">{{ product.vendor.business_name }}</p>
                        <p class="mt-1 text-sm font-bold text-gray-900">₹{{ product.base_price }}</p>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</section>

<style>
/* Hide scrollbar for Chrome, Safari and Opera */
.hide-scrollbar::-webkit-scrollbar {
  display: none;
}
/* Hide scrollbar for IE, Edge and Firefox */
.hide-scrollbar {
  -ms-overflow-style: none;  /* IE and Edge */
  scrollbar-width: none;  /* Firefox */
}
</style>
{% endif %}
