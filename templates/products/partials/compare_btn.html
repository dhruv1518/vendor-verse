{% with pid=product.public_id|stringformat:"s" %}
{% with in_comp=in_compare|default_if_none:"" %}
{% with is_active=in_comp|yesno:"1,0,check" %}
<button type="button"
        hx-post="{% url 'products:compare_toggle' public_id=product.public_id %}"
        hx-swap="outerHTML"
        hx-target="this"
        onclick="event.stopPropagation();"
        class="inline-flex items-center justify-center rounded-full p-2.5 transition-all duration-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2
               {% if is_active == '1' or pid in compare_list %}bg-blue-600 text-white ring-2 ring-blue-600 hover:bg-blue-700 shadow-blue-500/20{% else %}bg-white/90 backdrop-blur-sm text-gray-500 hover:text-blue-600 hover:bg-blue-50 ring-1 ring-gray-200 hover:ring-blue-300{% endif %}
               {% if compare_list|length >= 4 and pid not in compare_list and is_active != '1' %}opacity-50 cursor-not-allowed{% endif %}"
        title="{% if is_active == '1' or pid in compare_list %}In Comparison (Click to remove){% elif compare_list|length >= 4 %}Compare list full (Max 4){% else %}Add to Compare{% endif %}"
        id="compare-btn-elem-{{ product.public_id }}"
        {% if compare_list|length >= 4 and pid not in compare_list and is_active != '1' %}disabled{% endif %}>
    <svg class="h-5 w-5 transition-transform duration-200 active:scale-90" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5L7.5 3m0 0L12 7.5M7.5 3v13.5m13.5 0L16.5 21m0 0L12 16.5m4.5 4.5V7.5" />
    </svg>
</button>

<!-- Live Navbar Count Badge OOB Updates -->
<span id="nav-compare-badge" hx-swap-oob="true" class="absolute -top-0.5 -right-0.5 flex h-4.5 w-4.5 items-center justify-center rounded-full bg-blue-600 text-[10px] font-bold text-white ring-2 ring-white transition-transform duration-300 {% if not compare_count or compare_count == 0 %}hidden{% endif %}">
    {{ compare_count|default:"0" }}
</span>
<span id="nav-compare-badge-mobile" hx-swap-oob="true" class="ml-auto inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-700 {% if not compare_count or compare_count == 0 %}hidden{% endif %}">
    {{ compare_count|default:"0" }}
</span>
{% endwith %}
{% endwith %}
{% endwith %}
