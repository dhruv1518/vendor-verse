{% load static %}<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Updating Workspace...</title>
</head>
<body style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center; color: #4f46e5; font-weight: 600; font-size: 14px;">
        <div style="width: 36px; height: 36px; border: 3px solid rgba(79, 70, 229, 0.2); border-top-color: #4f46e5; border-radius: 50%; animation: vvSpin 0.75s linear infinite; margin: 0 auto 12px auto;"></div>
        Saving and synchronizing...
    </div>
    <style>
        @keyframes vvSpin { to { transform: rotate(360deg); } }
    </style>
    <script id="django-admin-popup-response-constants"
            src="{% static 'admin/js/popup_response.js' %}"
            data-popup-response="{{ popup_response_data }}">
    </script>
</body>
</html>
