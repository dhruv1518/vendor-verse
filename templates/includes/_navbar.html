<nav class="bg-white shadow sticky top-0 z-40">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 justify-between">
      <div class="flex items-center gap-x-6">
        <div class="flex flex-shrink-0 items-center">
          <a href="/" class="text-2xl font-bold text-primary-600">VendorVerse</a>
        </div>
        <!-- Main nav links -->
        <div class="hidden sm:flex sm:items-center sm:gap-x-4">
          <a href="{% url 'vendors:directory' %}" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors">Vendors</a>
        </div>
      </div>
      <div class="flex items-center space-x-4">
        {% if user.is_authenticated %}
            {% if user.role == 'VENDOR' %}
            <a href="{% url 'vendors:dashboard' %}" class="text-sm font-medium text-primary-600 hover:text-primary-500 transition-colors">Dashboard</a>
            {% elif user.role == 'CUSTOMER' %}
            <a href="{% url 'vendors:apply' %}" class="text-sm font-medium text-secondary-600 hover:text-secondary-500 transition-colors">Become a Vendor</a>
            {% endif %}
            <a href="{% url 'accounts:profile' %}" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors">My Profile</a>
            <span class="hidden sm:inline text-sm text-gray-400">{{ user.email }}</span>
            <form method="post" action="{% url 'account_logout' %}" class="inline">
                {% csrf_token %}
                <button type="submit" class="text-sm font-medium text-red-500 hover:text-red-700 transition-colors">Sign out</button>
            </form>
        {% else %}
            <a href="{% url 'account_login' %}" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors">Sign in</a>
            <a href="{% url 'account_signup' %}" class="rounded-md bg-primary-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-primary-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600 transition-all">Create Account</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
