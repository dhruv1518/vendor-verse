{% extends "base.html" %}

{% block title %}Password Reset Sent - VendorVerse{% endblock %}

{% block content %}
<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10 text-center">
            <svg class="mx-auto h-12 w-12 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <h2 class="mt-6 text-2xl font-bold leading-9 tracking-tight text-gray-900">Email Sent</h2>
            <p class="mt-4 text-sm text-gray-600">
                We have sent you an e-mail. Please contact us if you do not receive it within a few minutes.
            </p>
            <div class="mt-8">
                <a href="{% url 'account_login' %}" class="font-medium text-primary-600 hover:text-primary-500">
                    Return to sign in
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
