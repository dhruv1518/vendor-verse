{% load static %}
<div class="py-6">
    {% if order.status == 'CANCELLED' %}
    <div class="rounded-xl border border-red-200 bg-red-50 p-6">
        <div class="flex items-center gap-4">
            <div class="flex h-12 w-12 items-center justify-center rounded-full bg-red-100">
                <svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </div>
            <div>
                <h3 class="text-lg font-medium text-red-900">Order Cancelled</h3>
                <p class="mt-1 text-sm text-red-700">This order has been cancelled and will not be fulfilled.</p>
            </div>
        </div>
    </div>
    {% else %}
    <div class="relative">
        <div class="absolute inset-0 flex items-center" aria-hidden="true">
            <div class="w-full border-t border-gray-200"></div>
        </div>
        <div class="relative flex justify-between">
            <!-- PENDING -->
            <div class="flex flex-col items-center">
                <span class="relative flex h-8 w-8 items-center justify-center rounded-full bg-primary-600 ring-4 ring-white">
                    <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                </span>
                <span class="mt-2 text-xs font-semibold text-primary-600">Pending</span>
            </div>

            <!-- PROCESSING -->
            <div class="flex flex-col items-center">
                <span class="relative flex h-8 w-8 items-center justify-center rounded-full ring-4 ring-white
                    {% if order.status == 'PROCESSING' or order.status == 'SHIPPED' or order.status == 'DELIVERED' %}
                        bg-primary-600
                    {% else %}
                        bg-gray-200
                    {% endif %}">
                    <svg class="h-5 w-5 {% if order.status == 'PROCESSING' or order.status == 'SHIPPED' or order.status == 'DELIVERED' %}text-white{% else %}text-gray-500{% endif %}" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.34 15.84c-.688-.06-1.386-.09-2.09-.09H7.5a4.5 4.5 0 1 1 0-9h.75c.704 0 1.402-.03 2.09-.09m0 9.18c.253.962.584 1.892.985 2.783.247.55.06 1.21-.463 1.511l-.657.38c-.551.318-1.26.117-1.527-.461a20.845 20.845 0 0 1-1.44-4.282m3.102.069a18.03 18.03 0 0 1-.59-4.59c0-1.586.205-3.124.59-4.59m0 9.18a23.848 23.848 0 0 1 8.835 2.535M10.34 6.66a23.847 23.847 0 0 0 8.835-2.535m0 0A23.74 23.74 0 0 0 18.795 3m.38 1.125a23.91 23.91 0 0 1 1.014 5.395m-1.014 8.855c-.118.38-.245.754-.38 1.125m.38-1.125a23.91 23.91 0 0 0 1.014-5.395m0-3.46c.495.413.811 1.035.811 1.73 0 .695-.316 1.317-.811 1.73m0-3.46a24.347 24.347 0 0 1 0 3.46" />
                    </svg>
                </span>
                <span class="mt-2 text-xs font-medium {% if order.status == 'PROCESSING' or order.status == 'SHIPPED' or order.status == 'DELIVERED' %}text-primary-600 font-semibold{% else %}text-gray-500{% endif %}">Processing</span>
            </div>

            <!-- SHIPPED -->
            <div class="flex flex-col items-center">
                <span class="relative flex h-8 w-8 items-center justify-center rounded-full ring-4 ring-white
                    {% if order.status == 'SHIPPED' or order.status == 'DELIVERED' %}
                        bg-primary-600
                    {% else %}
                        bg-gray-200
                    {% endif %}">
                    <svg class="h-5 w-5 {% if order.status == 'SHIPPED' or order.status == 'DELIVERED' %}text-white{% else %}text-gray-500{% endif %}" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125h1.125M9 11.25v1.5c0 .621.504 1.125 1.125 1.125h6.75c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H10.125c-.621 0-1.125.504-1.125 1.125Z" />
                    </svg>
                </span>
                <span class="mt-2 text-xs font-medium {% if order.status == 'SHIPPED' or order.status == 'DELIVERED' %}text-primary-600 font-semibold{% else %}text-gray-500{% endif %}">Shipped</span>
            </div>

            <!-- DELIVERED -->
            <div class="flex flex-col items-center">
                <span class="relative flex h-8 w-8 items-center justify-center rounded-full ring-4 ring-white
                    {% if order.status == 'DELIVERED' %}
                        bg-green-500
                    {% else %}
                        bg-gray-200
                    {% endif %}">
                    <svg class="h-5 w-5 {% if order.status == 'DELIVERED' %}text-white{% else %}text-gray-500{% endif %}" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                </span>
                <span class="mt-2 text-xs font-medium {% if order.status == 'DELIVERED' %}text-green-600 font-semibold{% else %}text-gray-500{% endif %}">Delivered</span>
            </div>
        </div>
        
        <!-- Progress Bar Fill -->
        <div class="absolute inset-0 flex items-center" aria-hidden="true" style="z-index: -1;">
            <div class="h-0.5 bg-primary-600 transition-all duration-1000 ease-in-out" 
                 style="width: {% if order.status == 'PENDING' %}0%{% elif order.status == 'PROCESSING' %}33.3%{% elif order.status == 'SHIPPED' %}66.6%{% elif order.status == 'DELIVERED' %}100%{% endif %};">
            </div>
        </div>
    </div>
    {% endif %}
</div>
